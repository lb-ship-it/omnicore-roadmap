<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniCore</title>
</head>
<body style="margin:0;padding:0;background-color:#EDEBF4;color:#120E25;">
  <!--
    Colors from https://omnicore.vision/style.css (live 2026-10-03):
      --bg-navy #120E25, --bg-surface #1B1537, --accent-cyan #00E5FF,
      --text-secondary #B7B0D6, --text-muted #8E86AD, --accent-emerald #10B981.
    Site is very dark. This mail uses a pale tint of #120E25
    (HSL 250 28% 94% = #EDEBF4) as the outer background.
    Card fill is 50% #EDEBF4 + 50% white = #F6F5FA.
    Text is #120E25. Accent #00E5FF is only the 4px header bar.
    Placeholder is 40% #120E25 + 60% #8E86AD = #5C5677.
    Card border is 85% #EDEBF4 + 15% #120E25 = #CCCAD5.
    Text stays dark so it remains readable if a client strips backgrounds.
    Logo: https://omnicore.vision/assets/omnicore-symbol-radar-green-108.png
  -->
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#EDEBF4;margin:0;padding:0;">
    <tr>
      <td align="center" style="padding:28px 12px;background-color:#EDEBF4;">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;background-color:#F6F5FA;border:1px solid #CCCAD5;">
          <tr>
            <td style="background-color:#00E5FF;height:4px;line-height:4px;font-size:4px;">&nbsp;</td>
          </tr>
          <tr>
            <td style="padding:22px 28px 8px 28px;background-color:#F6F5FA;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="padding:0 10px 0 0;vertical-align:middle;">
                    <img src="https://omnicore.vision/assets/omnicore-symbol-radar-green-108.png" width="32" height="32" alt="OmniCore" style="display:block;border:0;outline:none;text-decoration:none;">
                  </td>
                  <td style="vertical-align:middle;font-family:Arial, Helvetica, sans-serif;font-size:20px;line-height:24px;font-weight:bold;color:#120E25;">
                    OmniCore
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:20px 28px 36px 28px;background-color:#F6F5FA;font-family:Arial, Helvetica, sans-serif;font-size:16px;line-height:24px;color:#120E25;">
              <p style="margin:0 0 20px 0;color:#5C5677;font-style:italic;">[ZÁSTUPNÝ TEXT — sem patří tělo e-mailu. Tento řádek smažte.]</p>
              <p style="margin:0;line-height:24px;color:#120E25;">&nbsp;</p>
            </td>
          </tr>
          <tr>
            <td style="padding:0 28px 20px 28px;background-color:#F6F5FA;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="border-top:1px solid #CCCAD5;padding-top:16px;font-family:Arial, Helvetica, sans-serif;font-size:14px;line-height:21px;color:#120E25;">
                    <p style="margin:0 0 4px 0;color:#120E25;">BART — AI assistant Ladislava Blechy</p>
                    <p style="margin:0;"><a href="mailto:bart@omnicore.vision" style="color:#120E25;text-decoration:underline;">bart@omnicore.vision</a></p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
